name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create SPA stub
        run: mkdir -p internal/web/static/spa && touch internal/web/static/spa/.gitkeep

      - name: Run tests
        run: go test ./... -count=1 -race

      - name: go vet
        run: go vet ./...

      # Installed directly rather than via the action: the action's major versions track
      # golangci-lint v1, and .golangci.yml is a v2 config. A pinned version also keeps
      # CI from turning red on someone else's release day.
      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    # docker-compose ships PostgreSQL, but every migration is written in SQLite-flavoured
    # SQL and only ever ran there. This job is what proves the documented install works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chq
          POSTGRES_PASSWORD: chq
          POSTGRES_DB: chqtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create SPA stub
        run: mkdir -p internal/web/static/spa && touch internal/web/static/spa/.gitkeep

      - name: Migration and repository tests against PostgreSQL
        env:
          TEST_POSTGRES_DSN: postgres://chq:chq@127.0.0.1:5432/chqtest?sslmode=disable
        run: go test ./internal/repository/ -count=1 -run TestPostgres -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Unit tests
        working-directory: web
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, frontend, postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: make build-frontend

      - name: Build binary
        run: CGO_ENABLED=0 go build -o contactshq ./cmd/server

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      # The build context ignores .gitignore, so a developer's real configs/config.yaml used
      # to be baked into the image. Plant one and prove it does not survive the build.
      - name: Plant a local config.yaml in the build context
        run: |
          printf 'auth:\n  jwt_secret: "leaked-secret-marker"\n' > configs/config.yaml

      # The release workflow is the first place a broken Dockerfile used to surface,
      # by which point the tag already exists.
      - name: Build image
        run: docker build -t contactshq:ci .

      - name: Local config.yaml did not reach the image
        run: |
          docker run --rm --entrypoint sh contactshq:ci -c '! test -f /app/configs/config.yaml' \
            || { echo "configs/config.yaml was baked into the image"; exit 1; }
          docker run --rm --entrypoint sh contactshq:ci -c 'test -f /app/configs/config.example.yaml' \
            || { echo "config.example.yaml is missing from the image"; exit 1; }

      - name: Remove the planted config
        run: rm -f configs/config.yaml

      - name: Start container
        run: |
          docker run -d --name chq -p 8080:8080 \
            -e CHQ_AUTH_JWT_SECRET="$(openssl rand -hex 32)" \
            contactshq:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' chq)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "container never became healthy"
          docker logs chq
          exit 1

      - name: Migrations ran inside the image
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery","display_name":"CI"}')
          [ "$code" = "201" ] || { echo "register returned $code"; docker logs chq; exit 1; }

      - name: Runs unprivileged
        run: |
          uid=$(docker exec chq id -u)
          [ "$uid" != "0" ] || { echo "container runs as root"; exit 1; }

      # The supported way out of a forgotten password. Exercised here because it is the one
      # path that runs the binary as something other than a server.
      - name: set-password changes the password
        run: |
          printf 'replacement-password-42\n' \
            | docker exec -i chq ./contactshq set-password ci@example.com --stdin

          new=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"replacement-password-42"}')
          [ "$new" = "200" ] || { echo "login with the new password returned $new"; exit 1; }

          old=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"correct-horse-battery"}')
          [ "$old" = "401" ] || { echo "login with the old password returned $old"; exit 1; }

      - name: set-password reports a missing user
        run: |
          set +e
          printf 'replacement-password-42\n' \
            | docker exec -i chq ./contactshq set-password nobody@example.com --stdin
          code=$?
          set -e
          [ "$code" = "3" ] || { echo "expected exit code 3 for an unknown user, got $code"; exit 1; }

      - name: The password never reaches the process list or the logs
        run: |
          docker inspect chq | grep -q 'replacement-password-42' && { echo "password leaked into docker inspect"; exit 1; }
          docker logs chq 2>&1 | grep -q 'replacement-password-42' && { echo "password leaked into the logs"; exit 1; }
          exit 0

      # The encoder fix, end to end: a list separator must survive import and export as a
      # separator, not as an escaped comma that collapses two categories into one.
      - name: vCard list separators survive a round trip
        run: |
          token=$(curl -s -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"replacement-password-42"}' \
            | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
          [ -n "$token" ] || { echo "could not obtain a token"; exit 1; }

          curl -s -o /dev/null -X POST http://127.0.0.1:8080/api/v1/contacts \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"first_name":"Grace","last_name":"Hopper","categories":["work","friends"],"photo_uri":"data:image/jpeg;base64,/9j/4AAQ"}'

          export_body=$(curl -s http://127.0.0.1:8080/api/v1/export/vcard -H "Authorization: Bearer $token")
          echo "$export_body" | grep -q 'CATEGORIES:work,friends' \
            || { echo "categories were not exported as two items:"; echo "$export_body"; exit 1; }
          echo "$export_body" | grep -q 'PHOTO:data:image/jpeg;base64,/9j/4AAQ' \
            || { echo "the photo URI was escaped:"; echo "$export_body"; exit 1; }

      # Backup history: a manual backup must be recorded, or "last successful backup" is a
      # lie for anyone who backs up by hand.
      - name: A manual backup is recorded in the history
        run: |
          token=$(curl -s -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"replacement-password-42"}' \
            | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

          curl -s -o /dev/null -X POST http://127.0.0.1:8080/api/v1/backup/create \
            -H "Authorization: Bearer $token"

          runs=$(curl -s http://127.0.0.1:8080/api/v1/backup/runs -H "Authorization: Bearer $token")
          echo "$runs" | grep -q '"status":"completed"' \
            || { echo "no completed run in the history:"; echo "$runs"; exit 1; }
          echo "$runs" | grep -q '"trigger":"manual"' \
            || { echo "the manual trigger was not recorded:"; echo "$runs"; exit 1; }

          status=$(curl -s http://127.0.0.1:8080/api/v1/backup/status -H "Authorization: Bearer $token")
          echo "$status" | grep -q '"last_success"' \
            || { echo "no last_success in the status:"; echo "$status"; exit 1; }

      - name: reencode-vcards is a dry run by default and refuses a half job
        run: |
          docker exec chq ./contactshq reencode-vcards | grep -q 'Dry run' \
            || { echo "the default run was not a dry run"; exit 1; }

          set +e
          docker exec chq ./contactshq reencode-vcards --apply
          code=$?
          set -e
          [ "$code" = "2" ] || { echo "--apply without --reconcile-sync-state returned $code, want 2"; exit 1; }

          docker exec chq ./contactshq reencode-vcards --apply --reconcile-sync-state >/dev/null
          docker exec chq ./contactshq reencode-vcards | grep -q '0 of' \
            || { echo "a second pass still found work to do — the rewrite is not idempotent"; exit 1; }
