
server:
  port: 8080
  # The real ceiling on a request body: fasthttp reads it entirely into memory before any
  # handler runs, so N concurrent uploads cost N × this. The per-route limits are policy on
  # top of it, not protection. Env: CHQ_SERVER_MAX_BODY_BYTES
  max_body_bytes: 33554432   # 32 MiB
  # Import is the one route where a large body is the point. Must not exceed max_body_bytes.
  # Env: CHQ_SERVER_MAX_IMPORT_BYTES
  max_import_bytes: 33554432
  # Bounds how long a client may take to send a request. Env: CHQ_SERVER_READ_TIMEOUT
  read_timeout: 30s
  idle_timeout: 120s
  # write_timeout is deliberately absent and must stay 0: restore and import run
  # synchronously inside the request, so a write deadline truncates an operation that is
  # still changing contacts. The server refuses to start with a non-zero value.
  host: "0.0.0.0"
  # Reverse proxies whose X-Forwarded-For header may be trusted, as IPs or CIDR
  # ranges. Leave empty when exposed directly. Set this behind a proxy so auth
  # rate limiting keys on the real client IP instead of the proxy's address.
  # Env: CHQ_SERVER_TRUSTED_PROXIES (comma-separated, e.g. "10.0.0.0/8,::1").
  trusted_proxies: []

database:
  driver: "sqlite"
  dsn: "contactshq.db"

auth:
  # Public sign-up at POST /auth/register. Off by default: creating the FIRST account is
  # always allowed so a new instance can be bootstrapped, but after that an open endpoint
  # hands an account to anyone who can reach the port. Administrators can always add users
  # through POST /admin/users regardless of this setting.
  # Env: CHQ_AUTH_ALLOW_REGISTRATION
  allow_registration: false
  # Required, min 32 characters. Generate with: openssl rand -hex 32
  # The server refuses to start without it (or with a known placeholder value).
  # Can also be supplied via the CHQ_AUTH_JWT_SECRET environment variable.
  jwt_secret: ""
  # There is no token denylist — checking one would cost a database read on every
  # authenticated request — so these lifetimes ARE the revocation window. To cut every
  # session at once, change jwt_secret and restart.
  # Env: CHQ_AUTH_TOKEN_TTL / CHQ_AUTH_REFRESH_TTL
  token_ttl: "1h"
  refresh_ttl: "168h"

google:
  # Optional global defaults. Users provide their own credentials via the UI.
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8080/api/v1/auth/google/callback"

carddav:
  path_prefix: "/dav"
  # Largest single vCard a device may PUT through /dav, also announced to clients as
  # CARDDAV:max-resource-size so they learn it before uploading; a larger card is refused with
  # 413. Only this write path is checked — the REST API, import and inbound sync can store a
  # bigger card, and such a card can then never be edited from a device until you raise this.
  # Env: CHQ_CARDDAV_MAX_RESOURCE_BYTES
  max_resource_bytes: 1048576  # 1 MiB

backup:
  dir: "./backups"
  schedule: "0 2 * * *"
  # Cap on the decompressed size a restore will read into memory. A gzip backup can expand
  # by orders of magnitude, and a replace-restore deletes before it writes.
  # Env: CHQ_BACKUP_MAX_RESTORE_BYTES
  max_restore_bytes: 134217728 # 128 MiB

merge:
  # How long a record of a contact merge is kept. Each record holds a snapshot of the
  # discarded card so a merge can be undone by hand, so this table grows with use.
  # Env: CHQ_MERGE_LOG_RETENTION_DAYS
  log_retention_days: 30

sync:
  # Permit plain http provider endpoints. Off by default: a sync request carries the
  # provider's username and password. Env: CHQ_SYNC_ALLOW_INSECURE_ENDPOINTS
  allow_insecure_endpoints: false
  # How long a record of a pipeline run is kept. Unlike backup history — about one row a day —
  # this table gains a row per pipeline execution.
  # Env: CHQ_SYNC_RUNS_RETENTION_DAYS
  runs_retention_days: 90

log:
  level: "info"
  format: "json"
