version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    paths:
      # Vendored Go sources ship inside some npm packages; they are not ours.
      - web/node_modules
    rules:
      # A deferred Close on a reader is idiomatic and its error is not actionable.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)$'
      # bun.In still works and is what the driver documents for IN clauses; bun.List and
      # bun.Tuple are not drop-in replacements for a plain id list.
      - linters: [staticcheck]
        text: 'SA1019: bun.In is deprecated'
      # Reaching through an embedded Field reads clearer than relying on promotion here.
      - linters: [staticcheck]
        text: 'QF1008'
      # CLI output: a failed write to stdout/stderr leaves nothing useful to do — the channel
      # for reporting it is the one that just failed — and the exit code still carries the
      # result. Scoped to the command package so handler code stays covered.
      - linters: [errcheck]
        path: 'cmd/server/'
        text: 'fmt\.Fprint(f|ln)?'
