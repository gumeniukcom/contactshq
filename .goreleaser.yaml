version: 2

before:
  hooks:
    - make build-frontend
    # Writes .release-notes.md from the CHANGELOG section for this tag, for the
    # --release-notes flag the release workflow passes. Fails the release if the section is
    # missing, rather than publishing an empty body. The workflow generates it again before
    # invoking goreleaser, so the file exists no matter when the flag is read.
    - ./scripts/release-notes.sh

builds:
  - id: contactshq
    main: ./cmd/server
    binary: contactshq
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.BuildTime={{.Date}}

archives:
  - id: contactshq
    ids:
      - contactshq
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - configs/config.example.yaml
      - migrations/
      - docker-compose.yml
      - README.md
      - LICENSE

dockers:
  - id: contactshq-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/gumeniukcom/contactshq:{{ .Tag }}-amd64"
      # A prerelease tag must not move :latest onto an unstable build.
      - "ghcr.io/gumeniukcom/contactshq:{{ if .Prerelease }}{{ .Tag }}{{ else }}latest{{ end }}-amd64"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=ContactsHQ"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/gumeniukcom/contactshq"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      # Template only — never the whole directory, which may hold a real config.yaml.
      - configs/config.example.yaml

  - id: contactshq-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/gumeniukcom/contactshq:{{ .Tag }}-arm64"
      - "ghcr.io/gumeniukcom/contactshq:{{ if .Prerelease }}{{ .Tag }}{{ else }}latest{{ end }}-arm64"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=ContactsHQ"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/gumeniukcom/contactshq"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      # Template only — never the whole directory, which may hold a real config.yaml.
      - configs/config.example.yaml

docker_manifests:
  - name_template: "ghcr.io/gumeniukcom/contactshq:{{ .Tag }}"
    image_templates:
      - "ghcr.io/gumeniukcom/contactshq:{{ .Tag }}-amd64"
      - "ghcr.io/gumeniukcom/contactshq:{{ .Tag }}-arm64"
  # A prerelease must not move :latest onto an unstable build. On a prerelease this
  # collapses to the version manifest above, which is simply written twice.
  - name_template: "ghcr.io/gumeniukcom/contactshq:{{ if .Prerelease }}{{ .Tag }}{{ else }}latest{{ end }}"
    image_templates:
      - "ghcr.io/gumeniukcom/contactshq:{{ if .Prerelease }}{{ .Tag }}{{ else }}latest{{ end }}-amd64"
      - "ghcr.io/gumeniukcom/contactshq:{{ if .Prerelease }}{{ .Tag }}{{ else }}latest{{ end }}-arm64"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
      - Merge pull request
      - Merge branch
